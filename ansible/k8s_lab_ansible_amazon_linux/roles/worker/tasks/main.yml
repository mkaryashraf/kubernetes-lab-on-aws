- name: Check if node is already joined
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Check if node is actually ready in cluster
  command: kubectl get node {{ inventory_hostname }} --no-headers
  delegate_to: cp
  changed_when: false
  failed_when: false
  register: node_status

# One fact, computed once, used by every task below. The reset and the join used
# to test different conditions, and a node that had joined but was NotReady
# matched the reset condition and none of the join conditions: it was wiped,
# never rejoined, and the playbook still reported success. Keep this as the only
# condition in the role so the two halves cannot drift apart again.
- name: Decide whether this node must join
  set_fact:
    needs_join: >-
      {{ not kubelet_conf.stat.exists
         or node_status.rc != 0
         or 'NotReady' in node_status.stdout }}

- name: Reset kubeadm if the node must rejoin
  command: kubeadm reset -f
  when: needs_join | bool

- name: Clean up kubernetes files after reset
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes
    - /var/lib/kubelet
    - /root/.kube
  when: needs_join | bool

- name: Get IMDSv2 token
  uri:
    url: http://169.254.169.254/latest/api/token
    method: PUT
    headers:
      X-aws-ec2-metadata-token-ttl-seconds: 21600
    return_content: yes
    status_code: 200
  register: imds_token

- name: Fail if token not received
  fail:
    msg: "IMDSv2 token request failed"
  when: imds_token.content is not defined or imds_token.content == ""

- name: Get EC2 instance availability zone
  uri:
    url: http://169.254.169.254/latest/meta-data/placement/availability-zone
    headers:
      X-aws-ec2-metadata-token: "{{ imds_token.content }}"
    return_content: yes
    status_code: 200
  register: az
  when: needs_join | bool

- name: Get EC2 instance ID
  uri:
    url: http://169.254.169.254/latest/meta-data/instance-id
    headers:
      X-aws-ec2-metadata-token: "{{ imds_token.content }}"
    return_content: yes
    status_code: 200
  register: instance_id
  when: needs_join | bool


- name: Get node primary IP
  shell: hostname -I | awk '{print $1}'
  register: node_ip
  changed_when: false

- name: Create kubernetes config directory
  file:
    path: /etc/kubernetes
    state: directory
    mode: '0755'
  when: needs_join | bool

- name: Create kubeadm join config
  copy:
    dest: /etc/kubernetes/join-config.yaml
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: JoinConfiguration
      discovery:
        bootstrapToken:
          token: "{{ hostvars['cp']['join_token'] }}"
          apiServerEndpoint: "{{ hostvars['cp']['join_endpoint'] }}"
          caCertHashes:
            - "{{ hostvars['cp']['join_ca_hash'] }}"
      nodeRegistration:
        kubeletExtraArgs:
        - name: provider-id
          value: "aws:///{{ az.content }}/{{ instance_id.content }}"
        - name: node-ip
          value: "{{ node_ip.stdout }}"
        # See the control-plane role for why this is here and not just
        # provider-id. The node is NotReady until the cloud controller manager
        # removes the uninitialized taint.
        - name: cloud-provider
          value: external
  when: needs_join | bool

- name: Join worker node to cluster
  command: kubeadm join --config /etc/kubernetes/join-config.yaml --ignore-preflight-errors=all
  args:
    creates: /etc/kubernetes/kubelet.conf   # ← extra safety, skip if already exists
  when: needs_join | bool