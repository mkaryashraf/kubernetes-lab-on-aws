---
- name: Add AWS Cloud Controller Manager Helm repo
  command: helm repo add aws-cloud-controller-manager https://kubernetes.github.io/cloud-provider-aws
  changed_when: false

- name: Add EBS CSI Driver Helm repo
  command: helm repo add aws-ebs-csi-driver https://kubernetes-sigs.github.io/aws-ebs-csi-driver
  changed_when: false

- name: Add EKS Helm repo
  command: helm repo add eks https://aws.github.io/eks-charts
  changed_when: false

- name: Update Helm repos
  command: helm repo update
  changed_when: false

# Every controller below calls the EC2 API, so all of them must sit on the
# control plane. That is what lets the workers run with no instance profile at
# all. A nodeSelector alone is not enough: kubeadm taints the control plane
# NoSchedule, so each pod needs the matching toleration as well.
#
# This file is for the controllers that run after the node is initialized. The
# cloud controller manager is the one that does the initializing and needs a
# second toleration, so it gets its own file below.
- name: Create control-plane pinning values
  copy:
    dest: /root/cp-pinned.yaml
    content: |
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

# The cloud controller manager needs one toleration the others must not have.
# kubeadm registers every node with cloud-provider: external, which taints it
# node.cloudprovider.kubernetes.io/uninitialized:NoSchedule, and the CCM is the
# only thing that removes that taint. Handing the CCM the file above instead of
# this one replaces the chart's default toleration list, which already contains
# the uninitialized key, and drops it. The DaemonSet controller then matches zero
# nodes, so DESIRED stays 0 and `helm --wait` reports success in seconds having
# waited for nothing. The taint is never lifted and every later pod - the Load
# Balancer Controller, coredns, calico-kube-controllers - sits Pending until helm
# times out with "context deadline exceeded".
- name: Create cloud controller manager pinning values
  copy:
    dest: /root/cp-pinned-ccm.yaml
    content: |
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node.cloudprovider.kubernetes.io/uninitialized
          value: "true"
          effect: NoSchedule

# Keys nest under controller: on purpose. The EBS CSI node DaemonSet must stay
# on every node, or volume mounting on the workers breaks.
- name: Create EBS CSI controller pinning values
  copy:
    dest: /root/cp-pinned-csi.yaml
    content: |
      controller:
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule

- name: Install AWS Cloud Controller Manager
  command: >
    helm upgrade --install aws-cloud-controller-manager
    aws-cloud-controller-manager/aws-cloud-controller-manager
    --namespace kube-system
    --values /root/cp-pinned-ccm.yaml
    --set args[0]="--v=2"
    --set args[1]="--cloud-provider=aws"
    --set args[2]="--cluster-name={{ cluster_name }}"
    --set args[3]="--configure-cloud-routes=false"
    --wait

- name: Install AWS Load Balancer Controller
  command: >
    helm upgrade --install aws-load-balancer-controller
    eks/aws-load-balancer-controller
    --namespace kube-system
    --values /root/cp-pinned.yaml
    --set clusterName={{ cluster_name }}
    --set region={{ aws_region }}
    --set vpcId={{ vpc_id }}
    --set replicaCount=1
    --set serviceAccount.create=true
    --set serviceAccount.name=aws-load-balancer-controller
    --wait

- name: Install EBS CSI Driver
  command: >
    helm upgrade --install aws-ebs-csi-driver
    aws-ebs-csi-driver/aws-ebs-csi-driver
    --namespace kube-system
    --values /root/cp-pinned-csi.yaml
    --set controller.serviceAccount.create=true
    --set controller.serviceAccount.name=ebs-csi-controller-sa
    --wait

- name: Create EBS StorageClass
  copy:
    dest: /tmp/ebs-storageclass.yaml
    content: |
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: {{ storage_class_name }}
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
      provisioner: ebs.csi.aws.com
      volumeBindingMode: WaitForFirstConsumer
      parameters:
        type: gp3
        encrypted: "true"
      # Delete, not Retain. With Retain, terraform destroy takes the instances away
      # and leaves the EBS volumes behind, still billing, with nothing referencing
      # them: Prometheus 10Gi, Grafana 5Gi, Alertmanager 2Gi, every rebuild.
      reclaimPolicy: Delete

- name: Apply EBS StorageClass
  command: kubectl apply -f /tmp/ebs-storageclass.yaml
  changed_when: false