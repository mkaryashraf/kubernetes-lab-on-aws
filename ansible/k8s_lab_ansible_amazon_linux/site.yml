---
# No vars_files anywhere: the variables live in group_vars/all/, which Ansible
# loads automatically. group_vars/all/terraform.yml is generated by Terraform.
- name: Prepare all nodes
  hosts: kube_nodes
  become: yes
  roles:
    - common

- name: Setup Control Plane
  hosts: cp
  become: yes
  roles:
    - control-plane

- name: Join Worker Nodes
  hosts: workers
  become: yes
  roles:
    - worker

- name: apply workloads
  hosts: cp
  become: yes
  roles:
    - networking
    - ingress-certmanager
    - metrics-server
    - metallb
    - monitoring
